{% extends 'base.html' %}{% load static %}
{% block title %}编辑用户 - 库房备件管理系统{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>✏️ 编辑用户</h1>
    <p class="subtitle">{{ target_user.username }}</p>
  </div>
  <a href="{% url 'user_list' %}" class="btn btn-secondary">← 返回用户列表</a>
</div>

<div class="panel">
  <div class="panel-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-row">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" value="{{ target_user.username }}" disabled style="background:var(--surface-soft);color:var(--muted);">
          <p class="form-hint">用户名不可修改</p>
        </div>
        <div class="form-group">
          <label>姓名</label>
          <input type="text" name="first_name" value="{{ target_user.first_name }}" placeholder="用户真实姓名">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>所属业务组</label>
          <select name="group">
            <option value="">-- 请选择 --</option>
            {% for g in groups %}
            <option value="{{ g.id }}" {% if target_user.profile.group.id == g.id %}selected{% endif %}>{{ g.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>电话</label>
          <input type="text" name="phone" value="{{ target_user.profile.phone }}" placeholder="联系电话">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>工号</label>
          <input type="text" name="employee_id" value="{{ target_user.profile.employee_id }}" placeholder="工号">
        </div>
        <div class="form-group">
          <!-- spacer -->
        </div>
      </div>
      <div style="display:flex;gap:10px;">
        <button type="submit" class="btn btn-primary">保存修改</button>
        <a href="{% url 'user_list' %}" class="btn btn-secondary">取消</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
