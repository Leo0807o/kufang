{% extends 'base.html' %}

{% block content %}
<div class="page-header">
  <div>
    <h1>✏️ 填写单品信息</h1>
    <div class="subtitle">{{ item.name }} · 单品 #{{ asset_item.id }}</div>
  </div>
  <a href="{% url 'inventory_detail' item.id %}" class="btn btn-secondary">← 返回详情</a>
</div>

<div class="panel" style="max-width:520px;">
  <div class="panel-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>唯一资产码</label>
        <input type="text" name="asset_code" value="{{ asset_item.asset_code }}" placeholder="手动填写资产码">
      </div>
      <div class="form-group">
        <label>品种标识码</label>
        <input type="text" name="variety_code" value="{{ asset_item.variety_code }}" placeholder="手动填写品种码">
      </div>
      <div style="display:flex;gap:10px;margin-top:20px;">
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="{% url 'inventory_detail' item.id %}" class="btn btn-secondary">取消</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
