{% extends 'base.html' %}{% load static %}
{% block title %}重置密码 - 库房备件管理系统{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>🔑 重置密码</h1>
    <p class="subtitle">用户：{{ target_user.username }}</p>
  </div>
  <a href="{% url 'user_list' %}" class="btn btn-secondary">← 返回用户列表</a>
</div>

<div class="panel">
  <div class="panel-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>新密码 *</label>
        <input type="text" name="password" placeholder="请输入新密码" required autofocus>
        <p class="form-hint">设置新密码后，用户需使用新密码登录</p>
      </div>
      <div style="display:flex;gap:10px;">
        <button type="submit" class="btn btn-primary">确认重置</button>
        <a href="{% url 'user_list' %}" class="btn btn-secondary">取消</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
